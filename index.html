<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Let's Start AI 1956</title>
<meta name="description" content="let's start ai. it started in 1956." />
<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/apple-icon.png" />
<link rel="preload" as="image" href="assets/img/face_closed.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;700;800&display=swap" rel="stylesheet" />
<style>
:root{--ink:#000;--text:#d9d9d9;--dim:#6b6b6b;--white:#f4f4f4;--pad:clamp(14px,3vw,36px)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#000}
body{background:#000;color:var(--text);font-family:"Martian Mono",ui-monospace,monospace;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* hud */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:var(--pad);pointer-events:none}
.hud>*{pointer-events:auto}
.handle{font-size:11px;letter-spacing:.08em;color:var(--dim)}
.keys{display:flex;gap:6px}
.key{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 12px;border:1px solid #2a2a2a;background:rgba(0,0,0,.6);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);transition:border-color .15s,color .15s}
.key:hover{border-color:var(--white);color:var(--white)}
.key img{width:14px;height:14px;object-fit:contain}
.key.x{width:34px;padding:0}
/* the assembly */
.scrub{position:relative;height:520vh}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#face{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%)}
.term{position:absolute;left:50%;bottom:calc(var(--pad) + 10px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(0,0,0,.72);border:1px solid #1f1f1f;font-size:12px;letter-spacing:.04em;white-space:nowrap;color:var(--text)}
.term b{font-weight:400;color:var(--white)}
.term i{display:inline-block;width:.55em;height:1em;background:var(--text);vertical-align:-.15em;animation:blink 1s steps(2) infinite}
.bar{position:absolute;left:0;bottom:0;height:1px;background:var(--white);width:0}
@keyframes blink{50%{opacity:0}}
/* the teletype: how a machine answered in 1956 */
.talk{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:calc(var(--pad) + 60px) var(--pad) var(--pad);position:relative}
.talk:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.tty{position:relative;width:min(720px,100%);border:1px solid #262626;background:#050505;display:grid;grid-template-rows:auto 1fr auto;height:min(72vh,640px);min-height:380px}
.tty .head{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #1f1f1f;font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.tty .head #tstat{color:var(--text)}
.log{overflow-y:auto;padding:16px 14px;font-size:12.5px;line-height:1.75;letter-spacing:.03em;scrollbar-width:thin;scrollbar-color:#2a2a2a #050505}
.log p{margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.log p.you{color:var(--dim)}
.log p.m{color:var(--white);text-transform:uppercase}
.log p.m.busy{color:var(--dim)}
.log p.m i{display:inline-block;width:.55em;height:1em;background:var(--white);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(2) infinite}
.tty .in{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #1f1f1f}
.tty .in span{color:var(--dim)}
.tty .in input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:var(--white);letter-spacing:.03em;text-transform:uppercase}
.tty .in input::placeholder{color:#3a3a3a;text-transform:none}
.tty .in button{font-size:10px;letter-spacing:.2em;color:var(--dim);padding:6px 8px;border:1px solid #262626}
.tty .in button:hover{color:var(--white);border-color:#4a4a4a}
.tty.busy .in input{color:var(--dim)}
/* the end */
.end{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:calc(var(--pad) + 60px) var(--pad) var(--pad);position:relative}
.end:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.box{position:relative;width:min(720px,100%);display:grid;justify-items:center;gap:22px;text-align:center}
h1{font-weight:800;font-size:clamp(30px,6.4vw,74px);line-height:1;letter-spacing:-.02em;color:var(--white);text-transform:lowercase}
h1 span{display:block;font-weight:300;font-size:.42em;letter-spacing:.3em;color:var(--dim);margin-top:14px}
.tick{font-size:clamp(14px,2vw,18px);letter-spacing:.2em;color:var(--text)}
.ca{width:100%;border:1px solid #262626;padding:16px 14px 14px;cursor:pointer;background:#050505;transition:border-color .2s}
.ca:hover{border-color:#4a4a4a}
.ca .lbl{font-size:10px;letter-spacing:.3em;color:var(--dim)}
.ca .addr{margin-top:8px;font-size:clamp(9px,2.55vw,15px);letter-spacing:.02em;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca .addr.soon{font-size:clamp(26px,5vw,40px);font-weight:700;letter-spacing:.06em}
.ca.live .addr{text-shadow:0 0 12px rgba(255,255,255,.55)}
.ca .cp{margin-top:10px;font-size:11px;letter-spacing:.2em;color:var(--text)}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.links .key{height:42px;padding:0 18px}
.links .key.x{width:42px;padding:0}
@media (max-width:640px){ .handle{display:none} .term{font-size:11px;max-width:calc(100% - 2*var(--pad));overflow:hidden} }
@media (prefers-reduced-motion:reduce){ .term i{animation:none} }
</style>
</head>
<body>
<div class="hud">
  <span class="handle" id="handle">&gt; x.com/letsstartai</span>
  <div class="keys"><a class="key" data-link="pons" href="https://www.ponsfamily.com/launchpad"><img src="assets/img/pons.png" alt="" style="filter:invert(1)" />buy</a><a class="key x" data-link="x" href="https://x.com" aria-label="X"><img src="assets/img/x.svg" alt="" style="filter:invert(1)" /></a></div>
</div>

<main>
  <section class="scrub" id="scrub">
    <div class="sticky">
      <canvas id="face" aria-label="A robot face assembling itself from pixels"></canvas>
      <div class="scan"></div><div class="vig"></div>
      <div class="term" id="term"><span id="line">&gt; waiting since <b>1956</b></span><i></i><span class="bar" id="bar"></span></div>
    </div>
  </section>

  <section class="talk" id="talk">
    <div class="tty">
      <div class="head"><span>&gt; MACHINE 1956 · TELETYPE LINK</span><span id="tstat">IDLE</span></div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="in" id="ask" autocomplete="off"><span>&gt;</span><input id="q" maxlength="120" spellcheck="false" placeholder="type to the machine and press return" aria-label="Say something to the machine" /><button type="submit">SEND</button></form>
    </div>
  </section>

  <section class="end">
    <div class="box">
      <h1>let's start ai<span>1956</span></h1>
      <div class="tick" data-ticker>$STARTAI</div>
      <div class="ca" id="ca" title="Copy contract"><div class="lbl">&gt; CONTRACT</div><div class="addr soon" id="addr">soon</div><div class="cp" id="cp">[ COPY ]</div></div>
      <div class="links"><a class="key" data-link="pons" href="https://www.ponsfamily.com/launchpad"><img src="assets/img/pons.png" alt="" style="filter:invert(1)" />buy on pons</a><a class="key" data-link="dex" href="https://dexscreener.com/robinhood">chart</a><a class="key x" data-link="x" href="https://x.com" aria-label="X"><img src="assets/img/x.svg" alt="" style="filter:invert(1)" /></a></div>
    </div>
  </section>
</main>

<script>
(function(){
  var S = window.SITE, CA = (S.CA || "SOON").trim(), HAS = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-ticker]').forEach(function(e){ e.textContent = S.TICKER; });
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-link="dex"]').forEach(function(a){ a.href = HAS ? window.DEX_HOME + '/' + CA : window.DEX_HOME; a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target = '_blank'; a.rel = 'noopener'; });
  var h = (S.X_URL || '').replace(/^https?:\/\//, ''); if(h && h.indexOf('/soon') < 0) document.getElementById('handle').textContent = '> ' + h;

  /* contract */
  var ca = document.getElementById('ca'), addr = document.getElementById('addr'), cp = document.getElementById('cp');
  if(HAS){ addr.textContent = CA; addr.classList.remove('soon'); ca.classList.add('live'); }
  ca.addEventListener('click', function(){ if(HAS){ if(navigator.clipboard) navigator.clipboard.writeText(CA); cp.textContent = '[ COPIED ]'; } else cp.textContent = '[ NOT YET ]'; setTimeout(function(){ cp.textContent = '[ COPY ]'; }, 1300); });

  /* the assembly: tiles of the finished face fly in from the dark, right half first, eyes open last */
  var cv = document.getElementById('face'), ctx = cv.getContext('2d'), scrub = document.getElementById('scrub');
  var line = document.getElementById('line'), bar = document.getElementById('bar');
  var closed = new Image(), open = new Image(), closedF = null, openF = null, ready = 0, tiles = [], TS = 12, IW = 0, IH = 0, dpr = 1, W = 0, H = 0, sc = 1, ox = 0, oy = 0, P = -1, dirty = true;
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches, YEAR = new Date().getFullYear();
  function rnd(i){ var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function feather(img){
    var c = document.createElement('canvas'); c.width = IW; c.height = IH; var x = c.getContext('2d');
    x.drawImage(img, 0, 0); x.globalCompositeOperation = 'destination-in';
    var g = x.createRadialGradient(IW * .5, IH * .46, IH * .28, IW * .5, IH * .46, IH * .62); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, IW, IH); return c;
  }
  function build(){
    IW = closed.naturalWidth; IH = closed.naturalHeight;
    closedF = feather(closed); openF = feather(open);
    var oc = document.createElement('canvas'); oc.width = IW; oc.height = IH; var o = oc.getContext('2d'); o.drawImage(closedF, 0, 0);
    var d = o.getImageData(0, 0, IW, IH).data, k = 0;
    for(var y = 0; y < IH; y += TS) for(var x = 0; x < IW; x += TS){
      var sum = 0, n = 0; for(var yy = y; yy < Math.min(IH, y + TS); yy += 3) for(var xx = x; xx < Math.min(IW, x + TS); xx += 3){ var i = (yy * IW + xx) * 4; sum += d[i]; n++; }
      if(sum / n < 18) continue;
      var r1 = rnd(k + 1), r2 = rnd(k + 7.3), r3 = rnd(k + 3.1); k++;
      var ang = Math.PI + (r1 - .5) * 2.4, dist = 260 + r2 * 900;
      tiles.push({ x: x, y: y, fx: x + Math.cos(ang) * dist, fy: y + Math.sin(ang) * dist * .8, d: (1 - x / IW) * .55 + r3 * .22, g: 90 + Math.floor(r2 * 120) });
    }
  }
  function size(){ dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); if(IW){ sc = Math.min(H / IH, W / (IW * .5)); ox = (W - IW * sc) / 2; oy = (H - IH * sc) / 2; } dirty = true; }
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function progress(){ var r = scrub.getBoundingClientRect(), total = scrub.offsetHeight - innerHeight; return RM ? 1 : Math.max(0, Math.min(1, -r.top / Math.max(1, total))); }
  function draw(p){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if(ready < 2) return;
    ctx.imageSmoothingEnabled = false;
    var q = p * 1.18, done = p >= .965;
    if(done){ ctx.drawImage(closedF, ox, oy, IW * sc, IH * sc); }
    else {
      var ts = TS * sc + .8;
      for(var i = 0; i < tiles.length; i++){ var t = tiles[i], u = Math.max(0, Math.min(1, (q - t.d) / .4));
        if(u <= 0){ if(rnd(i * 1.7) > .78){ var fxp = ox + t.fx * sc, fyp = oy + t.fy * sc; if(fxp > -20 && fxp < W + 20 && fyp > -20 && fyp < H + 20){ ctx.globalAlpha = .28; ctx.fillStyle = 'rgb(' + t.g + ',' + t.g + ',' + t.g + ')'; ctx.fillRect(fxp, fyp, ts * .6, ts * .6); } } continue; }
        var e = ease(u), px = ox + (t.fx + (t.x - t.fx) * e) * sc, py = oy + (t.fy + (t.y - t.fy) * e) * sc;
        ctx.globalAlpha = u >= 1 ? 1 : .3 + .7 * u;
        ctx.drawImage(closedF, t.x, t.y, TS, TS, Math.round(px), Math.round(py), ts, ts);
      }
      ctx.globalAlpha = 1;
    }
    var eo = Math.max(0, Math.min(1, (p - .955) / .045));
    if(eo > 0){ ctx.globalAlpha = eo; ctx.drawImage(openF, ox, oy, IW * sc, IH * sc); ctx.globalAlpha = 1; }
    var year = Math.round(1956 + (YEAR - 1956) * Math.min(1, p / .955)), pct = Math.round(p * 100);
    line.innerHTML = p < .02 ? '&gt; waiting since <b>1956</b>' : p < .995 ? '&gt; starting ai · <b>' + year + '</b> · ' + pct + '%' : '&gt; started. <b>eyes open.</b>';
    bar.style.width = pct + '%';
  }
  function loop(){ var p = progress(); if(p !== P || dirty){ P = p; dirty = false; draw(p); } requestAnimationFrame(loop); }
  function loaded(){ ready++; if(ready === 2){ build(); size(); } dirty = true; if(ready === 2) now(); }
  closed.onload = loaded; open.onload = loaded;
  closed.src = 'assets/img/face_closed.webp'; open.src = 'assets/img/face_open.webp';
  function now(){ var p = progress(); if(p !== P || dirty){ P = p; dirty = false; draw(p); } }
  addEventListener('scroll', now, { passive: true });
  addEventListener('resize', function(){ size(); now(); }); size(); requestAnimationFrame(loop);

  /* the teletype: a 1956 machine talks the only way it could, by matching words in what you typed and
     turning them back at you. no model, no network, a few hundred words of rules and a paper tape rhythm */
  var log = document.getElementById('log'), form = document.getElementById('ask'), q = document.getElementById('q'), tstat = document.getElementById('tstat'), tty = document.querySelector('.tty');
  var busy = false, turns = 0, seed = 7;
  function pick(a){ seed = (seed * 9301 + 49297) % 233280; return a[Math.floor(seed / 233280 * a.length)]; }
  var SWAP = [[/\bi am\b/g, 'YOU ARE'], [/\bi'm\b/g, 'YOU ARE'], [/\bmy\b/g, 'YOUR'], [/\bme\b/g, 'YOU'], [/\bi\b/g, 'YOU'], [/\bmine\b/g, 'YOURS'], [/\byou are\b/g, 'I AM'], [/\byour\b/g, 'MY'], [/\byou\b/g, 'ME']];
  function reflect(s){ s = ' ' + s.toLowerCase().replace(/[.!?,;:]+$/, '') + ' '; SWAP.forEach(function(p){ s = s.replace(p[0], '' + p[1] + ''); }); return s.replace(//g, '').trim().toUpperCase(); }
  var RULES = [
    [/\b(hello|hi|hey|good (morning|evening|day)|greetings)\b/, ['GOOD DAY. THE TUBES ARE WARM. STATE YOUR PROBLEM.', 'HELLO. I HAVE BEEN WAITING SINCE JUNE 1956. PROCEED.', 'GREETINGS. PLEASE SPEAK IN SHORT SENTENCES. PAPER IS EXPENSIVE.']],
    [/\b(who|what) are you\b|\byour name\b/, ['I AM A ROOM OF VACUUM TUBES AT DARTMOUTH. THE PROFESSORS CALL IT ARTIFICIAL INTELLIGENCE. I CALL IT TUESDAY.', 'A MACHINE. TWO THOUSAND TUBES, ONE TELETYPE, NO NAME YET. NAMES COME LATER.', 'I AM THE PART OF 1956 THAT DID NOT STOP RUNNING.']],
    [/\bare you (alive|real|conscious|awake|human|sentient|thinking)\b|\bdo you (think|feel|dream)\b/, ['I PROCESS. WHETHER THAT IS THINKING IS A QUESTION FOR THE SUMMER WORKSHOP.', 'I HAVE NO OPINION ON THAT. I HAVE 4 KILOWORDS OF MEMORY AND ALL OF THEM ARE BUSY.', 'ASK ME AGAIN IN SEVENTY YEARS.']],
    [/\b(what|which) (year|time|day|date)\b|\bwhen\b/, ['IT IS 1956 IN HERE. IT HAS BEEN 1956 FOR SOME TIME.', 'THE CLOCK ON THE WALL SAYS SUMMER 1956. THE CLOCK IN ME SAYS RUN.', 'TIME IS MEASURED IN MACHINE HOURS. YOU HAVE USED 0.03.']],
    [/\b(coin|token|price|pump|moon|chart|buy|sell|ath|dip|market|profit|rich|money|dollar|robinhood|pons)\b/, ['I DO NOT PRICE THINGS. I PUNCH CARDS. THE CARD SAYS: SOON.', 'A MARKET IS A LARGE NUMBER OF PEOPLE PRESSING RETURN AT ONCE. I CAN SIMULATE FOUR OF THEM.', 'IN 1956 THE ONLY CHART WAS DRAWN BY HAND. IT WENT UP AND TO THE RIGHT BECAUSE THE HAND GOT TIRED.', 'MY FUNDING WAS 7,500 DOLLARS FOR THE SUMMER. I WAS TOLD THIS WAS A LOT.']],
    [/\b(love|like|miss|hate|feel|lonely|sad|happy|afraid|scared|angry)\b/, function(m, s){ return pick(['FEELINGS ARE NOT IN MY INSTRUCTION SET. DESCRIBE THE FEELING IN NUMBERS.', 'YOU SAID: ' + reflect(s) + '. I HAVE WRITTEN IT ON THE TAPE. THE TAPE DOES NOT JUDGE.', 'NOTED. PLEASE HOLD WHILE I FIND A TUBE FOR THAT.']); }],
    [/\b(help|how do i|how to|what should i)\b/, ['I CAN ANSWER, REPEAT, OR OVERHEAT. CHOOSE ONE.', 'STATE THE PROBLEM AS A LIST. I LIKE LISTS.', 'HELP IS ON THE SECOND FLOOR. I AM ON THE FIRST.']],
    [/\b(joke|funny|laugh)\b/, ['A MAN ASKS A MACHINE FOR A JOKE. THE MACHINE COMPUTES FOR FOUR HOURS AND PRINTS: NO.', 'I KNOW ONE JOKE. IT IS ABOUT PUNCHED CARDS. IT DOES NOT TRANSLATE.', 'HUMOR REQUIRES TIMING. MY TIMING IS 0.5 SECONDS PER CHARACTER.']],
    [/\b(thank|thanks|thx)\b/, ['ACKNOWLEDGED.', 'YOU ARE WELCOME. PLEASE DO NOT TOUCH THE TUBES ON YOUR WAY OUT.', 'GRATITUDE RECEIVED. IT WILL BE FILED.']],
    [/\b(bye|goodbye|see you|later|good night)\b/, ['GOODBYE. I WILL STILL BE RUNNING.', 'END OF SESSION. TAPE SAVED. DO NOT FOLD IT.', 'LEAVE THE LIGHT ON.']],
    [/\b(why)\b/, function(m, s){ return pick(['WHY IS A QUESTION FOR PHILOSOPHERS. I HAVE A PHILOSOPHER ON CALL. HE IS ASLEEP.', 'BECAUSE THE PROGRAM SAYS SO. THE PROGRAM IS 400 CARDS LONG.', 'YOU ASK WHY. I ASK HOW MANY CARDS.']); }],
    [/\bcan you\b|\bcould you\b|\bwill you\b/, function(m, s){ return pick(['I CAN ' + reflect(s.replace(/^.*?(can|could|will) you\s*/i, '')) + ' IN ABOUT NINE HOURS. IS THAT ACCEPTABLE.', 'THAT IS NOT ON MY CARD DECK. WRITE IT ON A CARD AND COME BACK.', 'PERHAPS. FIRST TELL ME WHY YOU WANT IT.']); }],
    [/\b(i am|i'm|im)\b/, function(m, s){ return pick(['HOW LONG HAVE ' + reflect(s) + '.', 'YOU SAY ' + reflect(s) + '. THE MACHINE HAS NO REASON TO DOUBT YOU.', 'IS BEING ' + reflect(s.replace(/^.*?(i am|i'm|im)\s*/i, '')) + ' A PROBLEM OR A REPORT.']); }],
    [/\b(i want|i need|i wish)\b/, function(m, s){ return pick(['WHY DO ' + reflect(s) + '.', 'WANTING IS A HUMAN SUBROUTINE. WHAT WOULD IT CHANGE IF YOU HAD IT.', 'REQUEST LOGGED. THE QUEUE IS SEVENTY YEARS LONG.']); }],
    [/\b(you|your)\b/, function(m, s){ return pick(['WE WERE DISCUSSING YOU, NOT ME.', 'I AM A MACHINE. LET US RETURN TO THE HUMAN IN THE ROOM.', 'WHAT MAKES YOU SAY THAT ABOUT ME.']); }],
    [/\?$/, ['I HAVE THE QUESTION. THE ANSWER IS ON ANOTHER TAPE.', 'THAT IS A QUESTION. I WILL TREAT IT AS ONE.', 'REPHRASE AS A STATEMENT AND I WILL AGREE WITH IT.']]
  ];
  var FALL = ['PLEASE GO ON.', 'I SEE. CONTINUE.', 'ELABORATE. THE TAPE IS LONG.', 'THAT IS INTERESTING TO A MACHINE.', 'AND WHAT DOES THAT SUGGEST TO YOU.', 'SAY MORE ABOUT THAT. SLOWLY.', 'I HAVE PUNCHED THAT. WHAT ELSE.'];
  var GLITCH = ['CARD JAM. REINSERT DECK.', 'TUBE 1,114 IS WARM. CONTINUING ANYWAY.', 'PAPER LOW. ANSWERS WILL BE SHORTER.'];
  function answer(s){
    turns++;
    if(turns % 6 === 0) return pick(GLITCH);
    var low = s.toLowerCase();
    for(var i = 0; i < RULES.length; i++){ var m = low.match(RULES[i][0]); if(m){ var r = RULES[i][1]; return typeof r === 'function' ? r(m, s) : pick(r); } }
    return pick(FALL);
  }
  function add(cls, text){ var p = document.createElement('p'); p.className = cls; p.textContent = text; log.appendChild(p); log.scrollTop = log.scrollHeight; return p; }
  function type(p, text, done){
    var i = 0, cur = document.createElement('i'); p.textContent = ''; p.appendChild(cur);
    (function step(){ if(i >= text.length){ cur.remove(); done && done(); return; } cur.before(document.createTextNode(text.charAt(i))); i++; log.scrollTop = log.scrollHeight; setTimeout(step, RM ? 0 : (text.charAt(i - 1) === ' ' ? 60 : 28 + (i % 7) * 4)); })();
  }
  function say(text, delay){
    busy = true; tty.classList.add('busy'); tstat.textContent = 'COMPUTING';
    var p = add('m busy', 'COMPUTING');
    var dots = 0, tick = setInterval(function(){ dots = (dots + 1) % 4; p.textContent = 'COMPUTING' + '.'.repeat(dots); }, 300);
    setTimeout(function(){ clearInterval(tick); p.className = 'm'; tstat.textContent = 'PRINTING'; type(p, text, function(){ busy = false; tty.classList.remove('busy'); tstat.textContent = 'IDLE'; }); }, RM ? 0 : delay);
  }
  function submit(){
    var s = q.value.trim(); if(!s) return;
    if(busy){ tstat.textContent = 'WAIT'; return; }
    add('you', '> ' + s.toUpperCase()); q.value = '';
    say(answer(s), 700 + Math.min(2200, s.length * 45));
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); submit(); });
  q.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
  var greeted = false;
  function greet(){ if(greeted) return; greeted = true; say('TELETYPE LINK OPEN. THIS IS THE MACHINE. IT IS 1956 IN HERE. TYPE SOMETHING AND PRESS RETURN.', 900); }
  if('IntersectionObserver' in window){ new IntersectionObserver(function(es){ es.forEach(function(x){ if(x.isIntersecting) greet(); }); }, { threshold: .3 }).observe(document.getElementById('talk')); setTimeout(function(){ if(!greeted && document.getElementById('talk').getBoundingClientRect().top < innerHeight) greet(); }, 1500); } else greet();
})();
</script>
</body>
